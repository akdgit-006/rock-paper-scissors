<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Rock, Paper, Scissors Game</title>
</head>

<body>
  <div class="container">
    <h1>Rock, Paper, Scissors Game</h1>
    <h2 class="score-title">Scoreboard</h2>
    <div class="scoreboard">
        <div class="player-score">
            <h3>Player:</h3>
            <p id="playerScore">0</p>
        </div>
        <div class="computer-score">
            <h3>Computer: </h3>
            <p id="computerScore">0</p>
        </div>
    </div>
    <div class="choices">
        <button class="choice" data-choice="rock">✊ Rock</button>
        <button class="choice" data-choice="paper">✋ Paper</button>
        <button class="choice" data-choice="scissors">✌️ Scissors</button>      
    </div>
    <div class="results">

            <p id="player-choice">
                Your Choice:
            </p>
            <p id="computer-choice">
                Computer Choice:
            </p>
            <h2 id="round-result">
                First to 5 wins!
            </h2>
        
        </div>
          <button id="reset-btn">
            Reset Game
        </button>

</div>
<script src="script.js"></script>
</body>

</html>
